services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - catalog_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s

volumes:
  catalog_data:
