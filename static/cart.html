<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Корзина — Электрокомплект</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="desk">
      <header class="mast">
        <a class="mark" href="/" aria-label="Назад в чат">ЭК</a>
        <div class="mast-copy">
          <p class="kicker">Электрокомплект · ekt.kz</p>
          <h1>Корзина</h1>
        </div>
        <a class="bin" href="/">К консультанту</a>
      </header>

      <main class="cart-page">
        <p id="empty-cart" class="empty-cart">
          Корзина пуста. Вернитесь в чат, выберите позицию и подтвердите накладную.
        </p>
        <table class="sheet" id="sheet" hidden>
          <thead>
            <tr>
              <th>Позиция</th>
              <th>Артикул</th>
              <th>Кол-во</th>
              <th>Цена</th>
              <th>Сумма</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="grand" id="grand" hidden></p>
      </main>
    </div>
    <script src="/static/cart.js"></script>
  </body>
</html>
