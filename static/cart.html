<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Корзина — Электрокомплект</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="desk cart-desk">
      <header class="mast">
        <a class="mark" href="/" aria-label="Назад в чат">ЭК</a>
        <div class="mast-copy">
          <p class="kicker">Электрокомплект · ekt.kz</p>
          <h1>Корзина</h1>
        </div>
        <a class="bin" href="/">К консультанту</a>
      </header>

      <main class="cart-page">
        <div id="empty-cart" class="empty-cart">
          <h2>Корзина пока пуста</h2>
          <p>Найдите товар в каталоге и подтвердите добавление в чате.</p>
          <a class="cart-return" href="/">Найти товар</a>
        </div>
        <div class="cart-scroll">
        <table class="sheet" id="sheet" hidden>
          <thead>
            <tr>
              <th>Позиция</th>
              <th>Артикул</th>
              <th>Кол-во</th>
              <th>Цена</th>
              <th>Сумма</th>
              <th><span class="sr-only">Действие</span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        </div>
        <p class="grand" id="grand" hidden></p>
        <p id="cart-status" class="cart-status" role="status" hidden></p>
        <p class="prototype-note">Демонстрационная корзина. Товар не резервируется, заказ не оформляется.</p>
      </main>
    </div>
    <script src="/static/cart.js"></script>
  </body>
</html>
